<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog NelsNovel</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<!-- Menambahkan Font Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font-main: 'Poppins', system-ui, -apple-system, sans-serif;
    --bg: #121216;
    --card-bg: #1d1d24;
    --secondary: #b79c6a;
    --text-light: #f5f5f5;
    --text-muted: #a0a0aa;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }

  /* PROTEKSI GAMBAR — cegah drag & select */
  img{
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: auto;
  }
  html{ scroll-behavior: smooth; }
  body{
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text-light);
    min-height: 100vh;
  }
  a{ color: inherit; text-decoration: none; }

  /* =====================================================
     NAVBAR
  ===================================================== */
  .navbar{
    position: sticky;
    top: 0;
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: rgba(18, 18, 22, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .navbar-logo{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    justify-self: start;
  }
  .navbar-logo-icon{
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: var(--secondary);
    color: #14161f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .navbar-img-logo{
  height: 36px;       /* tinggi logo dibatasi 36px */
  width: auto;        /* lebar menyesuaikan proporsi asli gambar */
  max-width: 120px;   /* jaga-jaga kalau logonya lebar/landscape */
  object-fit: contain;
  display: block;
  flex-shrink: 0;
  }
  .navbar-logo-text{ line-height: 1.2; }
  .navbar-logo-text .name{ font-weight: 800; font-size: 15px; }
  .navbar-logo-text .tagline{ font-size: 10px; color: var(--text-muted); }

  .navbar-links{
    display: flex;
    align-items: center;
    gap: 28px;
    justify-self: center;
  }
  .navbar-links a{
    font-weight: 600;
    font-size: 14px;
    color: var(--text-light);
    opacity: 0.85;
    transition: 0.2s ease;
    white-space: nowrap;
  }
  .navbar-links a:hover,
  .navbar-links a.active{ opacity: 1; color: var(--secondary); }

  @media (max-width: 720px){
    .navbar{ grid-template-columns: auto 1fr; padding: 12px 16px; }
    .navbar-links{ justify-self: end; gap: 16px; }
    .navbar-links a{ font-size: 12px; }
  }
  @media (max-width: 480px){
    .navbar-logo-text{ display: none; }
  }

  /* =====================================================
     HERO SECTION
     Semua ukuran pakai clamp() supaya mengecil/membesar
     mengikuti lebar layar secara halus (dinamis), tapi
     tata letak & posisi internal TIDAK PERNAH berubah.
  ===================================================== */
  .hero{
    position: relative;
    z-index: 1;
    max-width: 1300px;
    margin: 0 auto;
    padding: clamp(28px, 8vw, 80px) clamp(20px, 5vw, 40px);
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hero-content{
    max-width: clamp(280px, 55vw, 620px);
  }
  .hero-badge{
    color: var(--secondary);
    font-weight: 700;
    font-size: clamp(10px, 1.4vw, 14px);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: clamp(8px, 1.6vw, 14px);
  }
  .hero-title{
    font-family: 'Poppins', sans-serif;
    font-size: clamp(28px, 7vw, 68px);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: clamp(8px, 1.6vw, 16px);
  }
  .hero-desc{
    color: var(--text-muted);
    font-size: clamp(13px, 1.8vw, 18px);
    line-height: 1.75;
    max-width: clamp(240px, 48vw, 520px);
    margin-bottom: clamp(14px, 2.6vw, 26px);
  }
  .hero-cta{
    display: inline-flex;
    align-items: center;
    gap: clamp(4px, 0.8vw, 8px);
    background: var(--secondary);
    color: #14161f;
    border: none;
    padding: clamp(9px, 1.6vw, 16px) clamp(16px, 3.2vw, 32px);
    border-radius: 10px;
    font-weight: 700;
    font-size: clamp(12px, 1.6vw, 16px);
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
  }
  .hero-cta:hover{ filter: brightness(1.08); transform: translateY(-2px); }

  .hero-wrap{
    max-width: 1400px;
    margin: 20px auto 0;
    padding: 0 20px;
  }
  .hero-card{
    position: relative;
    background: #1c1c22;
    border-radius: 32px;
    overflow: hidden;
    height: clamp(320px, 50vw, 720px);
  }
  .hero-bg-image{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .hero-card picture{
    display: contents;
  }

  /* =====================================================
     SECTION HEADING
  ===================================================== */
  .section-heading{
    font-family: 'Poppins', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    padding: 24px 16px 0;
    letter-spacing: 0.5px;
  }

  /* =====================================================
     CAROUSEL COVERFLOW
  ===================================================== */
  .carousel-wrap{
    position: relative;
    padding: 20px 16px 10px;
  }
  .carousel-stage{
    position: relative;
    height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coverflow-card{
    position: absolute;
    width: 250px;
    aspect-ratio: 3/4;
    border-radius: 16px;
    overflow: hidden;
    background: var(--card-bg);
    border: 2px solid var(--secondary); /* Warna stroke dipatenkan */
    transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.65s ease,
                box-shadow 0.65s ease,
                filter 0.65s ease;
    cursor: pointer;
  }
  .coverflow-card img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .coverflow-card .cf-title{
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }

  /* Animasi floatCard dihapus agar efek geser mulus tidak bertabrakan */
  .coverflow-card.pos-0{
    transform: translateX(0) scale(1);
    z-index: 5;
    box-shadow: 0 22px 40px -10px var(--secondary);
    filter: brightness(1);
  }
  .coverflow-card.pos-1{
    transform: translateX(190px) scale(0.78);
    z-index: 4;
    box-shadow: 0 14px 26px -10px var(--secondary);
    filter: brightness(0.8);
  }
  .coverflow-card.pos-neg1{
    transform: translateX(-190px) scale(0.78);
    z-index: 4;
    box-shadow: 0 14px 26px -10px var(--secondary);
    filter: brightness(0.8);
  }
  .coverflow-card.pos-2{
    transform: translateX(340px) scale(0.58);
    z-index: 3;
    box-shadow: 0 8px 18px -8px var(--secondary);
    filter: brightness(0.6);
  }
  .coverflow-card.pos-neg2{
    transform: translateX(-340px) scale(0.58);
    z-index: 3;
    box-shadow: 0 8px 18px -8px var(--secondary);
    filter: brightness(0.6);
  }

  .carousel-arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ffffff;
    color: #000000;
    border: 2px solid var(--secondary);
    box-shadow: 0 3px 0 0 var(--secondary);
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .carousel-arrow.left{ left: 8px; }
  .carousel-arrow.right{ right: 8px; }

  @media (max-width: 780px){
    .carousel-stage{ height: 380px; }
    .coverflow-card{ width: 190px; }
    .coverflow-card.pos-1{ transform: translateX(130px) scale(0.75); }
    .coverflow-card.pos-neg1{ transform: translateX(-130px) scale(0.75); }
    .coverflow-card.pos-2{ transform: translateX(220px) scale(0.55); }
    .coverflow-card.pos-neg2{ transform: translateX(-220px) scale(0.55); }
  }
  @media (max-width: 560px){
    .carousel-stage{ height: 300px; }
    .coverflow-card{ width: 145px; }
    .coverflow-card.pos-1{ transform: translateX(95px) scale(0.72); }
    .coverflow-card.pos-neg1{ transform: translateX(-95px) scale(0.72); }
    .coverflow-card.pos-2{ transform: translateX(160px) scale(0.5); }
    .coverflow-card.pos-neg2{ transform: translateX(-160px) scale(0.5); }
    .coverflow-card .cf-title{ display: none; }
  }

  /* =====================================================
     KATALOG E-BOOK
  ===================================================== */
  .catalog-section{
    max-width: 1120px;
    margin: 0 auto;
    padding: 40px 24px 0;
  }
  .catalog-controls{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 18px;
  }

  .genre-wrap{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .genre-btn{
    background: transparent;
    color: var(--text-light);
    border: 2px solid var(--secondary);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .genre-btn.active{
    background: var(--secondary);
    color: #14161f;
  }

  .search-wrap{
    flex-shrink: 0;
    width: 260px;
    max-width: 100%;
  }
  .search-box{
    width: 100%;
    background: var(--card-bg);
    color: var(--text-light);
    border: 2px solid var(--secondary);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
  }
  .search-box::placeholder{ color: var(--text-muted); font-weight: 500; }
  .search-empty{ text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 16px; display: none; }

  @media (max-width: 640px){
    .catalog-controls{ flex-direction: column; align-items: stretch; }
    .search-wrap{ width: 100%; }
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
    padding: 26px 0 0;
  }
  .card{
    background: var(--card-bg);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card:hover{ transform: translateY(-4px); border-color: var(--secondary); }
  .card .cover{ width: 100%; aspect-ratio: 3/4; overflow: hidden; }
  .card .cover img{ width: 100%; height: 100%; object-fit: cover; }
  .card .info{ padding: 10px; }
  .card .title{ font-size: 12px; font-weight: 600; line-height: 1.4; }

  @media (max-width: 1000px){ .grid{ grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  @media (max-width: 780px){ .grid{ grid-template-columns: repeat(3, 1fr); gap: 12px; } }
  @media (max-width: 560px){ .grid{ grid-template-columns: repeat(2, 1fr); gap: 12px; } }
  @media (max-width: 360px){ .grid{ grid-template-columns: repeat(1, 1fr); } }

  .pagination{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 28px 16px 60px;
    flex-wrap: wrap;
  }
  .page-btn{
    background: #ffffff;
    color: #000000;
    border: 2px solid var(--secondary);
    box-shadow: 0 4px 0 0 var(--secondary);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .page-btn:hover{ filter: brightness(0.97); }
  .page-btn:disabled{ opacity: 0.4; cursor: not-allowed; }
  .page-info{ color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 0 6px; }
</style>
</head>

    const PRODUK_PER_HALAMAN = 20;
    let halamanAktif = 1;
    let kataKunci = "";
    let genreAktif = "Semua";

    const grid = document.getElementById("productGrid");
    const pagination = document.getElementById("pagination");
    const searchInput = document.getElementById("searchInput");
    const searchEmpty = document.getElementById("searchEmpty");
    const genreFilter = document.getElementById("genreFilter");

    // Helper: selalu ubah genre jadi array, entah aslinya teks tunggal atau sudah array
    function genreArray(item) {
      if (!item.genre) return [];
      return Array.isArray(item.genre) ? item.genre : [item.genre];
    }

    function getProdukTersaring() {
      return produk.filter(item => {
        const cocokJudul = !kataKunci || item.judul.toLowerCase().includes(kataKunci.toLowerCase());
        const cocokGenre = genreAktif === "Semua" || genreArray(item).includes(genreAktif);
        return cocokJudul && cocokGenre;
      });
    }

    function renderGenreFilter() {
      const semuaGenre = ["Semua", ...new Set(produk.flatMap(item => genreArray(item)))];
      genreFilter.innerHTML = "";
      semuaGenre.forEach(g => {
        const btn = document.createElement("button");
        btn.className = "genre-btn" + (g === genreAktif ? " active" : "");
        btn.textContent = g;
        btn.onclick = () => {
          genreAktif = g;
          halamanAktif = 1;
          renderGrid(halamanAktif);
          renderPagination(halamanAktif);
          renderGenreFilter();
        };
        genreFilter.appendChild(btn);
      });
    }

    function renderGrid(halaman) {
      grid.innerHTML = "";
      const hasil = getProdukTersaring();
      const mulai = (halaman - 1) * PRODUK_PER_HALAMAN;
      const akhir = mulai + PRODUK_PER_HALAMAN;
      const produkHalamanIni = hasil.slice(mulai, akhir);
      searchEmpty.style.display = hasil.length === 0 ? "block" : "none";

      produkHalamanIni.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="cover"><img src="${item.gambar}" alt="${item.judul}" loading="lazy"></div>
          <div class="info"><div class="title">${item.judul}</div></div>
        `;
        grid.appendChild(card);
      });
    }

    function renderPagination(halaman) {
      pagination.innerHTML = "";
      const hasil = getProdukTersaring();
      const totalHalaman = Math.max(1, Math.ceil(hasil.length / PRODUK_PER_HALAMAN));
      if (totalHalaman <= 1) return;

      const btnPrev = document.createElement("button");
      btnPrev.className = "page-btn";
      btnPrev.textContent = "← Sebelumnya";
      btnPrev.disabled = halaman === 1;
      btnPrev.onclick = () => gotoHalaman(halaman - 1);
      pagination.appendChild(btnPrev);

      const info = document.createElement("span");
      info.className = "page-info";
      info.textContent = `Halaman ${halaman} dari ${totalHalaman}`;
      pagination.appendChild(info);

      const btnNext = document.createElement("button");
      btnNext.className = "page-btn";
      btnNext.textContent = "Selanjutnya →";
      btnNext.disabled = halaman === totalHalaman;
      btnNext.onclick = () => gotoHalaman(halaman + 1);
      pagination.appendChild(btnNext);
    }

    function gotoHalaman(halaman) {
      const hasil = getProdukTersaring();
      const totalHalaman = Math.max(1, Math.ceil(hasil.length / PRODUK_PER_HALAMAN));
      if (halaman < 1 || halaman > totalHalaman) return;
      halamanAktif = halaman;
      renderGrid(halamanAktif);
      renderPagination(halamanAktif);
      grid.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    searchInput.addEventListener("input", (e) => {
      kataKunci = e.target.value.trim();
      halamanAktif = 1;
      renderGrid(halamanAktif);
      renderPagination(halamanAktif);
    });

    renderGenreFilter();
    renderGrid(halamanAktif);
    renderPagination(halamanAktif);

    // =====================================================
    // CAROUSEL
    // =====================================================
    let produkCarousel = produk.filter(item => item.baru).slice(0, 5);
    if(produkCarousel.length < 5) produkCarousel = produk.slice(0, 5);

    let indexTengah = 0;
    let cardElements = [];

    function buatCarousel() {
      const stage = document.getElementById("carouselStage");
      stage.innerHTML = "";
      cardElements = [];

      produkCarousel.forEach((item, i) => {
        const card = document.createElement("div");
        card.className = "coverflow-card";
        card.onclick = () => { indexTengah = i; updatePosisiCarousel(); resetAutoSlide(); };
        card.innerHTML = `<img src="${item.gambar}" alt="${item.judul}" loading="lazy"><div class="cf-title">${item.judul}</div>`;
        stage.appendChild(card);
        cardElements.push(card);
      });
      updatePosisiCarousel();
    }

    function updatePosisiCarousel() {
      const total = produkCarousel.length;
      cardElements.forEach((card, i) => {
        let jarak = i - indexTengah;
        if (jarak > total / 2) jarak -= total;
        if (jarak < -total / 2) jarak += total;
        const posClass = jarak === 0 ? "pos-0" : jarak === 1 ? "pos-1" : jarak === -1 ? "pos-neg1" : jarak === 2 ? "pos-2" : "pos-neg2";
        card.className = "coverflow-card " + posClass;
      });
    }

    function geserCarousel(arah) {
      const total = produkCarousel.length;
      indexTengah = (indexTengah + arah + total) % total;
      updatePosisiCarousel();
      resetAutoSlide();
    }

    let autoSlideTimer = null;
    function mulaiAutoSlide() { autoSlideTimer = setInterval(() => geserCarousel(1), 4000); }
    function resetAutoSlide() { clearInterval(autoSlideTimer); mulaiAutoSlide(); }

    mulaiAutoSlide();
    buatCarousel();

    buatCarousel();

    // =====================================================
    // PROTEKSI GAMBAR — nonaktifkan klik kanan
    // =====================================================
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>
